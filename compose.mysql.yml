name: meow-eyes-mysql57

services:
  mysql:
    image: mysql:5.7.24
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meow_eyes}
      MYSQL_USER: ${MYSQL_USER:-meow_migrator}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in backend/.env.mysql}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in backend/.env.mysql}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-default-row-format=DYNAMIC
      - --innodb-file-format=Barracuda
      - --innodb-large-prefix=ON
      - --innodb-file-per-table=ON
      - --innodb-page-size=16384
      - --default-authentication-plugin=mysql_native_password
      - --default-time-zone=+00:00
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION,ONLY_FULL_GROUP_BY,NO_ZERO_DATE,NO_ZERO_IN_DATE
      - --local-infile=OFF
    volumes:
      # A fresh volume prevents accidental reuse of MySQL 8 data files.
      - mysql57_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --silent --skip-column-names --execute="SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  mysql57_data:
